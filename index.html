<body>

<script>
'use strict';
/* =====================================================================
   NOIR · Panel de Licencias (PRIVADO — no lo entregues a clientes)
   Crea los números de licencia permanentes (NOIR-A1B2-C3D4-E5F6) y firma
   los códigos para restablecer contraseñas con tu clave privada.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dayKey(new Date());
const parseD = s => new Date(s + 'T00:00:00');
const fmtDate = s => { if (!s) return '—'; const d = parseD(s.slice(0, 10)); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dayKey(d); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return dayKey(d); };
const daysTo = s => Math.round((parseD(s) - parseD(today())) / 86400000);
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function toast(msg, type = 'ok') { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3500); }
const money = n => (+n || 0).toLocaleString('es-CO');

/* ---------- SHA-256 (mismo algoritmo que NOIR STORE) ---------- */
const SHA = (() => { const p = []; for (let n = 2; p.length < 64; n++) { let ok = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { ok = false; break; } if (ok) p.push(n); } const f = x => Math.floor((x - Math.floor(x)) * 2 ** 32) >>> 0; return { K: p.map(x => f(Math.cbrt(x))), H: p.slice(0, 8).map(x => f(Math.sqrt(x))) }; })();
function sha256(str) {
  const b = new TextEncoder().encode(String(str)), len = b.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(b); m[len] = 0x80; const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, (len * 8) >>> 0); dv.setUint32(total - 8, Math.floor(len * 8 / 2 ** 32));
  const r = (x, n) => (x >>> n) | (x << (32 - n)); const W = new Uint32Array(64), H = SHA.H.slice(), K = SHA.K;
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const x = W[i - 15], y = W[i - 2]; W[i] = (W[i - 16] + (r(x, 7) ^ r(x, 18) ^ (x >>> 3)) + W[i - 7] + (r(y, 17) ^ r(y, 19) ^ (y >>> 10))) >>> 0; }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0; const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0; }
    [a, bb, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) >>> 0);
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}
function hashPass(pw, salt) { let h = String(pw); for (let i = 0; i < 1500; i++) h = sha256(salt + ':' + h); return h; }
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');
function genPassword() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(8))].map(b => a[b % a.length]).join(''); }

/* ---------- base64url ---------- */
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uDec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

/* ---------- Almacenamiento ---------- */
const KEY_SLOT = 'noirlic-key', DB_SLOT = 'noirlic-db';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(DB_SLOT)) || null; } catch (e) { return null; } },
  save() { localStorage.setItem(DB_SLOT, JSON.stringify(S.db)); },
};
const S = { db: store.load() || { settings: { vendor: 'NOIR Studio', whatsapp: '', country: 'CO' }, clients: [], issuedKeys: [] }, signKey: null, publicJwk: null, tab: 'clients', q: '', filter: '', fplan: '' };

/* Cifrado de la clave privada con la contraseña del panel */
async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
/* Clave privada cifrada con el usuario y contraseña del panel (incluida en este archivo) */
const EMBEDDED_SLOT = null; /* versión web: la clave se carga desde tu archivo, nunca va en la página */
const getSlot = () => { try { return JSON.parse(localStorage.getItem(KEY_SLOT)) || EMBEDDED_SLOT; } catch (e) { return EMBEDDED_SLOT; } };
async function sealPrivate(jwkFile, password, user) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveKey(password, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(JSON.stringify(jwkFile))));
  localStorage.setItem(KEY_SLOT, JSON.stringify({ user: user || getSlot()?.user || 'Richy', salt: b64u(salt), iv: b64u(iv), ct: b64u(ct) }));
}
async function decryptSlot(password, slot = getSlot()) {
  const k = await deriveKey(password, b64uDec(slot.salt));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(slot.iv) }, k, b64uDec(slot.ct))));
}
async function openPrivate(password) {
  const slot = getSlot();
  const k = await deriveKey(password, b64uDec(slot.salt));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(slot.iv) }, k, b64uDec(slot.ct));
  const file = JSON.parse(new TextDecoder().decode(plain));
  S.signKey = await crypto.subtle.importKey('jwk', file.privateKey, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
  S.publicJwk = file.publicKey;
  S.sk = sha256('noir-short|' + file.privateKey.d);
}

/* ---------- Firma de códigos ---------- */
async function makeCode(payload) {
  const data = b64u(new TextEncoder().encode(JSON.stringify(payload)));
  const sig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, S.signKey, new TextEncoder().encode(data)));
  return `NOIR1.${data}.${b64u(sig)}`;
}
async function decodeCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^NOIR1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('Formato inválido');
  const payload = JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
  const pub = await crypto.subtle.importKey('jwk', S.publicJwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pub, b64uDec(m[2]), new TextEncoder().encode(m[1]));
  return { payload, ok };
}

/* ---------- Países (moneda e impuesto se aplican en el sistema) ---------- */
const COUNTRIES = [['CO', 'Colombia (COP)'], ['DO', 'República Dominicana (RD$)'], ['MX', 'México'], ['VE', 'Venezuela'], ['PE', 'Perú'], ['EC', 'Ecuador'], ['GT', 'Guatemala'], ['HN', 'Honduras'], ['SV', 'El Salvador'], ['NI', 'Nicaragua'], ['CR', 'Costa Rica'], ['PA', 'Panamá'], ['CL', 'Chile'], ['AR', 'Argentina'], ['ES', 'España'], ['US', 'Estados Unidos'], ['XX', 'Otro / sin impuesto']];
const countryName = k => (COUNTRIES.find(c => c[0] === k) || [, k || '—'])[1];

/* ---------- Modal ---------- */
function modal(title, body, footer = '', size = '') {
  const w = document.createElement('div'); w.className = 'back';
  w.innerHTML = `<div class="modal ${size}"><div class="mh"><h3>${title}</h3><button class="x" data-x>×</button></div><div class="mb">${body}</div>${footer ? `<div class="mf">${footer}</div>` : ''}</div>`;
  document.body.appendChild(w);
  const m = { el: w, $: s => w.querySelector(s), close: () => w.remove() };
  w.addEventListener('click', e => { if (e.target.closest('[data-x]')) m.close(); });
  setTimeout(() => { const f = w.querySelector('input:not([readonly]),textarea,select'); f && f.focus(); }, 30);
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const b = [...document.querySelectorAll('.back')].pop(); b && b.remove(); } });

/* ---------- Pantallas de acceso ---------- */
const STORE_PUB_X = 'hlLoieombQc23q161Ug5pdqRipCdcc9PYZ29S9ZphE4';
function lockScreen() {
  const slot = getSlot();
  if (!slot) return setupScreen();
  $('#root').innerHTML = `<div class="lock"><div class="lock-box">
    <img src="assets/mono-cromo.png" alt=""><h1>Panel de Licencias</h1>
    <p>Ingresa con tu usuario y contraseña <b>de vendedor</b>.<br><span class="small">Los usuarios de tus clientes (los del sistema NOIR STORE) no sirven aquí.</span></p>
    <div class="field"><label>Usuario</label><input id="us" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn chrome lg block" id="go">Entrar</button>
    <p class="small" style="margin-top:22px"><a href="#" id="reset" style="color:var(--muted)">¿Olvidaste la contraseña? Usar de nuevo tu archivo de clave</a></p></div></div>`;
  let fails = 0;
  const go = async () => {
    const typed = $('#us').value.trim().replace(/^[*"'`]+|[*"'`]+$/g, '');
    if (norm(typed) !== norm(slot.user || '')) { toast(`"${typed}" no es el usuario de este panel. Aquí entras con TU usuario de vendedor, no con el de un cliente.`, 'err'); $('#us').focus(); return; }
    try {
      const pw = $('#pw').value; let ok = false;
      for (const p of [...new Set([pw, pw.trim(), pw.trim().replace(/^[*"'`]+|[*"'`]+$/g, '')])]) { try { await openPrivate(p); ok = true; break; } catch (e) { } }
      if (!ok) throw new Error('pass');
      try { localStorage.setItem('noirlic-lastuser', $('#us').value.trim()); } catch (e) { }
      app();
    } catch (e) {
      fails++; toast('Contraseña del panel incorrecta', 'err'); $('#pw').value = ''; $('#pw').focus();
      if (fails >= 5) { $('#go').disabled = true; toast('Demasiados intentos. Espera 30 segundos.', 'warn'); setTimeout(() => { fails = 0; const g = $('#go'); if (g) g.disabled = false; }, 30000); }
    }
  };
  $('#go').onclick = go;
  $('#reset').onclick = e => { e.preventDefault(); if (confirm('Vas a configurar el acceso de nuevo con tu archivo de clave. Tus clientes NO se borran. ¿Continuar?')) { localStorage.removeItem(KEY_SLOT); setupScreen(); } };
  $('#us').addEventListener('keydown', e => e.key === 'Enter' && $('#pw').focus());
  $('#pw').addEventListener('keydown', e => e.key === 'Enter' && go());
  const last = localStorage.getItem('noirlic-lastuser'); if (last) $('#us').value = last;
  ($('#us').value ? $('#pw') : $('#us')).focus();
}
/* Primera vez en este navegador: cargar el archivo de clave y crear el acceso */
function setupScreen() {
  $('#root').innerHTML = `<div class="lock"><div class="lock-box" style="max-width:440px">
    <img src="assets/mono-cromo.png" alt=""><h1>Panel de Licencias</h1>
    <p>Primera vez en este navegador. Carga tu archivo <b>CLAVE-PRIVADA-NO-COMPARTIR.json</b> y crea tu usuario y contraseña. Solo se hace una vez.</p>
    <div class="field"><label>Archivo de clave</label><input id="kf" type="file" accept=".json,application/json"></div>
    <div class="field"><label>Usuario</label><input id="us" value="Richy" autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label>Contraseña (mín. 6)</label><input id="pw" type="password" autocomplete="new-password"></div>
    <div class="field"><label>Repetir contraseña</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <button class="btn chrome lg block" id="go">Configurar y entrar</button>
    <p class="small" style="margin-top:22px">Tu clave se guarda cifrada solo en este navegador; nunca se envía a internet.</p></div></div>`;
  $('#go').onclick = async () => {
    const f = $('#kf').files[0], us = $('#us').value.trim(), pw = $('#pw').value;
    if (!f) return toast('Selecciona tu archivo de clave', 'warn');
    if (us.length < 3) return toast('El usuario debe tener al menos 3 caracteres', 'warn');
    if (pw.length < 6) return toast('La contraseña debe tener al menos 6 caracteres', 'warn');
    if (pw !== $('#pw2').value) return toast('Las contraseñas no coinciden', 'warn');
    let file; try { file = JSON.parse(await f.text()); } catch (e) { return toast('Ese archivo no es válido', 'err'); }

const fmtUSD = n => 'US$ ' + (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const limText = p => [p.users > 0 ? `${p.users} usuario${p.users === 1 ? '' : 's'}` : 'usuarios ilimitados', p.products > 0 ? `${p.products} productos` : 'productos ilimitados', p.off.length ? `${FEATURES.length - p.off.length} de ${FEATURES.length} funciones` : 'todas las funciones y beneficios'].join(' · ');

/* Número de licencia permanente NOIR-A1B2-C3D4-E5F6: lleva el plan y solo este panel puede crearlo.
   La app lo comprueba sin internet (mismo código que js/licshort.js de NOIR STORE). */
const LicShort = (() => {
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const TOTAL = 24n ** 6n * 10n ** 6n, DATA = 1n << 21n, MACS = TOTAL / DATA;
  const A = 1000000007n, B = 98765432109876n;
  const inv = (a, m) => { let r0 = a % m, r1 = m, s0 = 1n, s1 = 0n; while (r1) { const q = r0 / r1; [r0, r1] = [r1, r0 - q * r1]; [s0, s1] = [s1, s0 - q * s1]; } return ((s0 % m) + m) % m; };
  const AI = inv(A, TOTAL);
  const mac = (secret, data) => BigInt(parseInt(sha256(secret + '|' + data).slice(0, 12), 16)) % MACS;
  function encode(n) {
    let s = '';
    for (let i = 11; i >= 0; i--) { const base = i % 2 ? 10n : 24n; const c = Number(n % base); n /= base; s = (i % 2 ? String(c) : L[c]) + s; }
    return `NOIR-${s.slice(0, 4)}-${s.slice(4, 8)}-${s.slice(8)}`;
  }
  function decode(body) {
    let n = 0n;
    for (let i = 0; i < 12; i++) {
      const ch = body[i];
      if (i % 2) { const d = '0123456789'.indexOf(ch); if (d < 0) return null; n = n * 10n + BigInt(d); }
      else { const d = L.indexOf(ch); if (d < 0) return null; n = n * 24n + BigInt(d); }
    }
    return n;
  }
  function canon(key) {
    const s = String(key || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^NOIR/, '');
    if (s.length !== 12) return null;
    return [...s].map((ch, i) => i % 2 ? ({ O: '0', Q: '0', D: '0', I: '1', L: '1', Z: '2', S: '5', B: '8' }[ch] || ch) : ({ '0': 'O', '1': 'I' }[ch] || ch)).join('');
  }
  return {
    make(secret, serial, tier) {
      const data = BigInt(serial) * 2n + (tier === 'premium' ? 1n : 0n);
      if (data >= DATA) throw new Error('serial fuera de rango');
      return encode(((data * MACS + mac(secret, data)) * A + B) % TOTAL);
    },
    check(secret, key) {
      const body = canon(key); if (!body || !secret) return null;
      const p = decode(body); if (p === null || p >= TOTAL) return null;
      const n = (((p - B) % TOTAL + TOTAL) % TOTAL) * AI % TOTAL;
      const data = n / MACS;
      if (data >= DATA || n % MACS !== mac(secret, data)) return null;
      return { key: encode(p), tier: data & 1n ? 'premium' : 'basic', serial: Number(data >> 1n) };
    },
  };
})();
const validKey = c => { const r = S.sk && LicShort.check(S.sk, c.key); return !!r && r.tier === c.tier; };
/* número nuevo, único y que nunca se repite (aunque se borre el cliente) */
function newKey(tier) {
  let k;
  do { const serial = crypto.getRandomValues(new Uint32Array(1))[0] % 1048576; k = LicShort.make(S.sk, serial, tier); }
  while (S.db.issuedKeys.includes(k) || S.db.clients.some(c => c.key === k));
  S.db.issuedKeys.push(k); store.save();
  return k;
}
const DEFAULT_APP_URL = 'https://github.com/noirstudio-web/noir-store/releases/latest/download/NOIR-STORE-Instalador.exe';
const appUrlOf = () => (S.db.settings.apkUrl && !/\.apk$/i.test(S.db.settings.apkUrl) ? S.db.settings.apkUrl : DEFAULT_APP_URL);
const licenseMsg = c => c.upgrade
  ? `Hola ${c.contact || c.business} 👋\n\nTu licencia de *NOIR STORE* para *${c.business}* ahora es *${planOf(c).name}* · permanente.\n\n🔑 Tu nuevo número de licencia:\n${c.key}\n\nEn el programa ve a *Configuración → Licencia*, escríbelo en “Cambiar a otro plan” y listo. Tus datos se conservan.\n\n${S.db.settings.vendor}`
  : `Hola ${c.contact || c.business} 👋\n\nGracias por tu compra. Ya tienes *NOIR STORE* para *${c.business}*.\nLicencia: *${planOf(c).name}* · permanente (es tuya, no se vence)\n${c.tier === 'premium' ? '⭐ Incluye apartados, puntos, promociones, comisiones, reportes, compras, WhatsApp y más.\n' : ''}\n💻 1. Descarga el programa en tu computador (Windows):\n${appUrlOf()}\nÁbrelo e instálalo. Si Windows muestra “Windows protegió tu PC”, toca *Más información → Ejecutar de todas formas*.\n\n🔑 2. Abre *NOIR STORE* (queda en el escritorio) y escribe tu número de licencia:\n${c.key}\n\n👤 3. Crea tu usuario y contraseña, y listo.\n\n💾 Tu información queda guardada en tu equipo: descarga un respaldo cada semana (Configuración → Respaldo y datos).\n\n${S.db.settings.vendor}`;
function migratePanel() {
  const d = S.db;
  d.settings.plans = Object.assign(DEFAULT_PLANS(), d.settings.plans || {});
  for (const k of ['basic', 'premium']) { const def = DEFAULT_PLANS()[k], p = d.settings.plans[k]; p.users = def.users; p.products = def.products; p.off = def.off; }
  d.settings.plansVer = PLANS_VER;
  d.issuedKeys = d.issuedKeys || [];
  d.clients.forEach(c => {
    if (!c.tier) c.tier = c.nextTier || 'premium';
    c.events = c.events || [];
    if (!c.key) c.key = newKey(c.tier);
    else if (!validKey(c)) {
      const nk = newKey(c.tier);
      c.oldKeys = [...(c.oldKeys || []), c.key];
      logEvent(c, 'Número de licencia permanente asignado', `${c.key} → ${nk}`);
      c.key = nk; delete c.sentAt;
    }
  });
  store.save();
}
const logEvent = (c, type, note = '') => { c.events = c.events || []; c.events.push({ date: new Date().toISOString(), type, note }); };
const saveClient = c => { const i = S.db.clients.findIndex(x => x.id === c.id); if (i >= 0) S.db.clients[i] = c; else S.db.clients.push(c); store.save(); };

    ${(c.sales || []).slice().reverse().map(v => `<tr><td>${fmtDate(v.date)}</td><td>${esc(v.plan)}</td><td class="mono small">${esc(v.key || '')}</td><td class="r">${v.currency === 'USD' ? fmtUSD(v.amount) : fmtCOP(v.amount)}</td></tr>`).join('') || '<tr><td colspan="4"><div class="empty" style="padding:20px">Sin ventas registradas</div></td></tr>'}
    </tbody></table>
    ${(c.events || []).length ? `<div class="hint" style="margin:16px 0 6px">Historial</div>${c.events.slice().reverse().map(e => `<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)">${fmtDate(e.date)} · <b>${esc(e.type)}</b> ${esc(e.note || '')}</div>`).join('')}` : ''}`,
    `<button class="btn ghost" data-x>Cerrar</button>`, 'lg');
  const reopen = () => { m.close(); app(); manageModal(S.db.clients.find(x => x.id === c.id)); };
  m.$('#m-ck').onclick = () => { navigator.clipboard.writeText(c.key); toast('Número de licencia copiado'); };
  m.$('#m-send').onclick = () => { m.close(); deliverModal(c); };
  m.$('#m-edit').onclick = () => { m.close(); clientForm(c); };
  m.$('#m-reset').onclick = () => { m.close(); resetModal(c); };
  m.$('#m-knew').onclick = () => {
    if (!confirm(`¿Darle a ${c.business} un número de licencia NUEVO (${p.name})?\n\nÚsalo si perdió el número o lo compartió. El anterior (${c.key}) sigue funcionando en los equipos donde ya está activado.`)) return;
    const old = c.key; c.key = newKey(c.tier); c.oldKeys = [...(c.oldKeys || []), old]; delete c.sentAt;
    logEvent(c, 'Número de licencia nuevo', `${old} → ${c.key}`); saveClient(c);
    toast(`Nuevo número: ${c.key}`); reopen();
  };
}

/* ---------- Restablecer usuario y contraseña (código firmado que el cliente pega en la app) ---------- */
function resetModal(c) {
  const m = modal(`Restablecer contraseña · ${esc(c.business)}`, `
    <p class="small muted" style="margin-top:0">Escribe el usuario y la contraseña nuevos del administrador. Se genera un código que el cliente pega en el programa, en la pantalla de ingreso → <b>¿Olvidaste tu contraseña?</b></p>
    <div class="grid2"><div class="field"><label>Usuario</label><input id="r-u" value="${esc(c.username || '')}" autocapitalize="off" placeholder="ej. maria"></div>
    <div class="field"><label>Contraseña nueva</label><div class="row" style="flex-wrap:nowrap"><input id="r-p" value="${esc(genPassword())}"><button class="btn" id="r-gen" type="button">Generar</button></div></div></div>
    <div id="r-out" style="margin-top:14px"></div>`,
    `<button class="btn ghost" data-x>Cerrar</button><button class="btn primary" id="r-go">Generar código</button>`, 'lg');
  m.$('#r-gen').onclick = () => m.$('#r-p').value = genPassword();
  m.$('#r-go').onclick = async () => {
    const u = m.$('#r-u').value.trim(), pw = m.$('#r-p').value.trim();
    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(u)) return toast('Usuario inválido: mínimo 3 caracteres, sin espacios', 'warn');
    if (pw.length < 4 || /\s/.test(pw)) return toast('Contraseña de mínimo 4 caracteres, sin espacios', 'warn');
    const s = randHex(12);
    const code = await makeCode({ v: 2, id: uid(), k: c.key, n: c.business, p: 'Restablecer acceso', tier: c.tier, e: '2099-12-31', t: today(), u, s, h: hashPass(pw, s), an: c.contact || 'Administrador', rs: 1 });
    c.username = u; logEvent(c, 'Contraseña restablecida', `Usuario ${u}`); saveClient(c);
    const msg = `Hola ${c.contact || c.business} 👋\n\nPara volver a entrar a *NOIR STORE*:\n1. Abre NOIR STORE y toca *¿Olvidaste tu contraseña?*\n2. Pega este código completo:\n\n${code}\n\n3. Entra con:\nUsuario:\n${u}\nContraseña:\n${pw}\n\n(Luego puedes cambiarla en Configuración → Mi cuenta)\n\n${S.db.settings.vendor}`;
    m.$('#r-out').innerHTML = `<div class="callout ok" style="margin-bottom:10px">✓ Código listo</div><div class="code">${esc(code)}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="r-cc">Copiar código</button><button class="btn" id="r-cm">Copiar mensaje</button>${c.phone ? `<a class="btn success" target="_blank" href="${waLink(c.phone, msg)}">Enviar por WhatsApp</a>` : ''}</div>`;
    m.$('#r-cc').onclick = () => { navigator.clipboard.writeText(code); toast('Código copiado'); };
    m.$('#r-cm').onclick = () => { navigator.clipboard.writeText(msg); toast('Mensaje copiado'); };
  };
}

/* ---------- Herramientas ---------- */
function verifyTool() {
  const m = modal('Verificar', `<div class="field"><label>Número de licencia (NOIR-XXXX-XXXX-XXXX) o código NOIR1…</label><textarea id="v-c" rows="3" class="mono" style="font-size:13px"></textarea></div><div id="v-out" style="margin-top:12px"></div>`,
    `<button class="btn ghost" data-x>Cerrar</button><button class="btn primary" id="v-go">Verificar</button>`);
  m.$('#v-go').onclick = async () => {
    const v = m.$('#v-c').value.trim();
    if (!/^NOIR1\./i.test(v.replace(/\s+/g, ''))) {
      const r = LicShort.check(S.sk, v), c = r && S.db.clients.find(x => x.key === r.key || (x.oldKeys || []).includes(r.key));
      m.$('#v-out').innerHTML = r ? `<div class="callout ok">✓ Número válido creado por tu panel · <b>${esc(S.db.settings.plans[r.tier].name)}</b> permanente</div><div class="small" style="margin-top:8px">${c ? `Cliente: <b>${esc(c.business)}</b>${c.key !== r.key ? ' (número anterior)' : ''}` : 'No está en tu lista de clientes.'}</div>`
        : '<div class="callout warn">✗ Ese número no es válido (mal escrito o no lo creó tu panel).</div>';
      return;
    }
    try {
      const { payload: p, ok } = await decodeCode(v);
      m.$('#v-out').innerHTML = `<div class="callout ${ok ? 'ok' : 'warn'}">${ok ? '✓ Firma válida (generado por tu panel)' : '✗ Firma inválida: este código no es tuyo o fue modificado'}</div>
        <div class="grid2" style="margin-top:12px"><div><div class="hint">Negocio</div>${esc(p.n || '—')}</div><div><div class="hint">Licencia</div><span class="mono">${esc(p.k || '—')}</span></div>
        <div><div class="hint">Tipo</div>${esc(p.p || p.type || '—')}</div><div><div class="hint">Emitido</div>${fmtDate(p.t)}</div><div><div class="hint">Usuario</div>${p.u ? esc(p.u) : '—'}</div></div>`;
    } catch (e) { m.$('#v-out').innerHTML = `<div class="callout warn">${esc(e.message)}</div>`; }
  };
}
function settingsModal() {
  const s = S.db.settings, P = s.plans;
  const planEditor = k => `<div class="card" style="padding:14px"><div class="field" style="margin-bottom:10px"><label>Nombre</label><input data-p="${k}" data-f="name" value="${esc(P[k].name)}"></div>
    <div class="grid2" style="gap:10px"><div class="field"><label>Precio de la licencia (COP)</label><input data-p="${k}" data-f="cop" inputmode="numeric" value="${P[k].cop}"></div><div class="field"><label>Precio (USD)</label><input data-p="${k}" data-f="usd" inputmode="decimal" value="${P[k].usd}"></div></div>
    <div class="hint" style="margin:12px 0 6px">Incluye (fijo en el programa): ${esc(limText(P[k]))}</div><div style="columns:2;column-gap:10px">${featList(P[k])}</div></div>`;
  const m = modal('Configuración del panel', `<div class="tabs"><button class="tab on" data-t="gen">General</button><button class="tab" data-t="plans">Planes y precios</button></div>
    <div data-pane="gen"><div class="grid2">
    <div class="field"><label>Tu nombre / marca</label><input id="s-v" value="${esc(s.vendor)}"></div>
    <div class="field"><label>Tu WhatsApp</label><input id="s-w" value="${esc(s.whatsapp)}" placeholder="573001234567"></div>
    <div class="field span2"><label>Enlace de descarga del programa (Windows)</label><input id="s-apk" value="${esc(appUrlOf())}"><span class="hint">Va en el mensaje que recibe cada cliente.</span></div>
    <div class="field span2"><label>Respaldo de clientes</label><div class="row"><button class="btn" id="s-exp">Descargar respaldo</button><button class="btn" id="s-imp">Restaurar respaldo</button></div><span class="hint">Los datos del panel viven en este navegador: descarga respaldos con frecuencia.</span></div>
    <div class="field span2"><label>Cambiar usuario y contraseña del panel</label><div class="row" style="flex-wrap:nowrap"><input id="s-p1" type="password" placeholder="Contraseña actual"><input id="s-u2" placeholder="Usuario" value="${esc(getSlot().user || 'Richy')}"><input id="s-p2" type="password" placeholder="Nueva contraseña (mín. 6)"><button class="btn" id="s-pw">Cambiar</button></div><span class="hint">Deja la nueva contraseña vacía para cambiar solo el usuario.</span></div></div></div>
    <div data-pane="plans" style="display:none"><div class="grid2">${planEditor('basic')}${planEditor('premium')}</div></div>`,
    `<button class="btn ghost" data-x>Cerrar</button><button class="btn primary" id="s-ok">Guardar</button>`, 'lg');
  m.el.querySelectorAll('[data-t]').forEach(t => t.onclick = () => { m.el.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === t)); m.el.querySelectorAll('[data-pane]').forEach(p => p.style.display = p.dataset.pane === t.dataset.t ? '' : 'none'); });
  m.$('#s-ok').onclick = () => {
    s.vendor = m.$('#s-v').value.trim() || 'NOIR Studio'; s.whatsapp = m.$('#s-w').value.replace(/\D/g, ''); s.apkUrl = m.$('#s-apk').value.trim() || DEFAULT_APP_URL;
    for (const k of ['basic', 'premium']) {
      const g = f => m.el.querySelector(`[data-p="${k}"][data-f="${f}"]`).value;
      P[k].name = g('name').trim() || P[k].name;
      P[k].cop = Math.round(+g('cop').replace(/[^\d]/g, '') || 0); P[k].usd = Math.round((+g('usd').replace(/[^\d.]/g, '') || 0) * 100) / 100;
    }
    store.save(); toast('Configuración guardada'); m.close(); app();
  };
  m.$('#s-exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.db, null, 2)], { type: 'application/json' })); a.download = `noir-licencias-clientes-${today()}.json`; a.click(); };
  m.$('#s-imp').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (!Array.isArray(d.clients)) throw 0; if (!confirm(`¿Reemplazar tus ${S.db.clients.length} clientes por los ${d.clients.length} del respaldo?`)) return; d.issuedKeys = [...new Set([...(d.issuedKeys || []), ...(S.db.issuedKeys || [])])]; S.db = d; store.save(); m.close(); app(); toast('Respaldo restaurado'); } catch (e) { toast('Archivo inválido', 'err'); } }; i.click(); };
  m.$('#s-pw').onclick = async () => {
    const p1 = m.$('#s-p1').value, p2 = m.$('#s-p2').value, u2 = m.$('#s-u2').value.trim();
    if (u2.length < 3) return toast('El usuario debe tener al menos 3 caracteres', 'warn');
    if (p2 && p2.length < 6) return toast('La nueva contraseña debe tener al menos 6 caracteres', 'warn');
    try { const file = await decryptSlot(p1); await sealPrivate(file, p2 || p1, u2); toast('Acceso al panel actualizado'); m.$('#s-p1').value = m.$('#s-p2').value = ''; }
    catch (e) { toast('La contraseña actual no es correcta', 'err'); }
  };
}

if (!window.isSecureContext || !crypto.subtle) document.getElementById('root').innerHTML = '<div class="lock"><div class="lock-box"><h1>Abre este archivo con doble clic</h1><p>El panel debe abrirse directamente desde la carpeta (file://) en Chrome o Edge.</p></div></div>';
else lockScreen();
</script>
</body>
</html>
