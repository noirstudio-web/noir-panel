<script>
'use strict';
/* =====================================================================
   NOIR · Panel de Licencias (PRIVADO — no lo entregues a clientes)
   Firma los códigos de activación con tu clave privada (ECDSA P-256).
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dayKey(new Date());
const parseD = s => new Date(s + 'T00:00:00');
const fmtDate = s => { if (!s) return '—'; const d = parseD(s.slice(0, 10)); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dayKey(d); };
const addMonths = (s, n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return dayKey(d); };
const daysTo = s => Math.round((parseD(s) - parseD(today())) / 86400000);
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function toast(msg, type = 'ok') { const t = document.createElement('div'); t.className = 'toast ' + type; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3500); }
const money = n => (+n || 0).toLocaleString('es-CO');

/* ---------- SHA-256 (mismo algoritmo que NOIR STORE) ---------- */
const SHA = (() => { const p = []; for (let n = 2; p.length < 64; n++) { let ok = true; for (let d = 2; d * d <= n; d++) if (n % d === 0) { ok = false; break; } if (ok) p.push(n); } const f = x => Math.floor((x - Math.floor(x)) * 2 ** 32) >>> 0; return { K: p.map(x => f(Math.cbrt(x))), H: p.slice(0, 8).map(x => f(Math.sqrt(x))) }; })();
function sha256(str) {
  const b = new TextEncoder().encode(String(str)), len = b.length, total = ((len + 9 + 63) >> 6) << 6;
  const m = new Uint8Array(total); m.set(b); m[len] = 0x80; const dv = new DataView(m.buffer);
  dv.setUint32(total - 4, (len * 8) >>> 0); dv.setUint32(total - 8, Math.floor(len * 8 / 2 ** 32));
  const r = (x, n) => (x >>> n) | (x << (32 - n)); const W = new Uint32Array(64), H = SHA.H.slice(), K = SHA.K;
  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(o + i * 4);
    for (let i = 16; i < 64; i++) { const x = W[i - 15], y = W[i - 2]; W[i] = (W[i - 16] + (r(x, 7) ^ r(x, 18) ^ (x >>> 3)) + W[i - 7] + (r(y, 17) ^ r(y, 19) ^ (y >>> 10))) >>> 0; }
    let [a, bb, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) { const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) >>> 0; const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = bb; bb = a; a = (t1 + t2) >>> 0; }
    [a, bb, c, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) >>> 0);
  }
  return H.map(x => x.toString(16).padStart(8, '0')).join('');
}
function hashPass(pw, salt) { let h = String(pw); for (let i = 0; i < 1500; i++) h = sha256(salt + ':' + h); return h; }
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');
function genPassword() { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(8))].map(b => a[b % a.length]).join(''); }

/* ---------- base64url ---------- */
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64uDec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

/* ---------- Almacenamiento ---------- */
const KEY_SLOT = 'noirlic-key', DB_SLOT = 'noirlic-db';
const store = {
  load() { try { return JSON.parse(localStorage.getItem(DB_SLOT)) || null; } catch (e) { return null; } },
  save() { localStorage.setItem(DB_SLOT, JSON.stringify(S.db)); },
};
const S = { db: store.load() || { settings: { vendor: 'NOIR Studio', whatsapp: '', country: 'CO' }, clients: [], issuedKeys: [] }, signKey: null, publicJwk: null, tab: 'clients', q: '', filter: '', fplan: '' };

/* Cifrado de la clave privada con la contraseña del panel */
async function deriveKey(password, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
/* Clave privada cifrada con el usuario y contraseña del panel (incluida en este archivo) */
const EMBEDDED_SLOT = null; /* versión web: la clave se carga desde tu archivo, nunca va en la página */
const getSlot = () => { try { return JSON.parse(localStorage.getItem(KEY_SLOT)) || EMBEDDED_SLOT; } catch (e) { return EMBEDDED_SLOT; } };
async function sealPrivate(jwkFile, password, user) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await deriveKey(password, salt);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(JSON.stringify(jwkFile))));
  localStorage.setItem(KEY_SLOT, JSON.stringify({ user: user || getSlot()?.user || 'Richy', salt: b64u(salt), iv: b64u(iv), ct: b64u(ct) }));
}
async function decryptSlot(password, slot = getSlot()) {
  const k = await deriveKey(password, b64uDec(slot.salt));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(slot.iv) }, k, b64uDec(slot.ct))));
}
async function openPrivate(password) {
  const slot = getSlot();
  const k = await deriveKey(password, b64uDec(slot.salt));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64uDec(slot.iv) }, k, b64uDec(slot.ct));
  const file = JSON.parse(new TextDecoder().decode(plain));
  S.signKey = await crypto.subtle.importKey('jwk', file.privateKey, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);
  S.publicJwk = file.publicKey;
}

/* ---------- Firma de códigos ---------- */
async function makeCode(payload) {
  const data = b64u(new TextEncoder().encode(JSON.stringify(payload)));
  const sig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, S.signKey, new TextEncoder().encode(data)));
  return `NOIR1.${data}.${b64u(sig)}`;
}
async function decodeCode(code) {
  const m = String(code).replace(/\s+/g, '').match(/^NOIR1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('Formato inválido');
  const payload = JSON.parse(new TextDecoder().decode(b64uDec(m[1])));
  const pub = await crypto.subtle.importKey('jwk', S.publicJwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
  const ok = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pub, b64uDec(m[2]), new TextEncoder().encode(m[1]));
  return { payload, ok };
}

/* ---------- Países (moneda e impuesto se aplican en el sistema) ---------- */
const COUNTRIES = [['CO', 'Colombia (COP)'], ['DO', 'República Dominicana (RD$)'], ['MX', 'México'], ['VE', 'Venezuela'], ['PE', 'Perú'], ['EC', 'Ecuador'], ['GT', 'Guatemala'], ['HN', 'Honduras'], ['SV', 'El Salvador'], ['NI', 'Nicaragua'], ['CR', 'Costa Rica'], ['PA', 'Panamá'], ['CL', 'Chile'], ['AR', 'Argentina'], ['ES', 'España'], ['US', 'Estados Unidos'], ['XX', 'Otro / sin impuesto']];
const countryName = k => (COUNTRIES.find(c => c[0] === k) || [, k || '—'])[1];

/* ---------- IndexedDB (para recordar la carpeta del sistema) ---------- */
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('noirlic', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  async set(k, v) { const db = await this.open(); return new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; }); },
};

/* ---------- ZIP (sin compresión, compatible con Windows) ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files) {
  const enc = new TextEncoder(), now = new Date();
  const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const parts = [], central = []; let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data || new Uint8Array(0), crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(38, f.name.endsWith('/') ? 0x10 : 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cd = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cd, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* ---------- Carpeta del sistema NOIR STORE ---------- */
const SKIP = new Set(['data', '.git', 'node_modules', 'PREPARAR COPIA PARA CLIENTE.bat', 'Thumbs.db', 'desktop.ini']);
async function readDir(dir, prefix = '', out = []) {
  for await (const [name, h] of dir.entries()) {
    if (!prefix && SKIP.has(name)) continue;
    if (name.endsWith('.tmp')) continue;
    if (h.kind === 'directory') { out.push({ name: prefix + name + '/' }); await readDir(h, prefix + name + '/', out); }
    else out.push({ name: prefix + name, data: new Uint8Array(await (await h.getFile()).arrayBuffer()) });
  }
  return out;
}
async function systemDir(ask = false) {
  let h = await idb.get('sysdir');
  if (h && !ask) {
    let p = await h.queryPermission({ mode: 'read' });
    if (p !== 'granted') p = await h.requestPermission({ mode: 'read' });
    if (p === 'granted') return h;
  }
  if (!window.showDirectoryPicker) throw new Error('Tu navegador no permite elegir carpetas. Usa Google Chrome o Microsoft Edge.');
  h = await showDirectoryPicker({ id: 'noirstore', mode: 'read' });
  let ok = false;
  try { const js = await h.getDirectoryHandle('js'); const lic = await (await js.getFileHandle('license.js')).getFile(); ok = (await lic.text()).includes(S.publicJwk.x); } catch (e) { }
  if (!ok) throw new Error('Esa carpeta no es el sistema NOIR STORE (o usa otra clave). Elige la carpeta que contiene index.html.');
  await idb.set('sysdir', h);
  return h;
}
async function buildPackage(c, code) {
  const dir = await systemDir();
  const files = await readDir(dir);
  const provision = {
    id: uid(), createdAt: new Date().toISOString(),
    vendor: { vendor: S.db.settings.vendor, whatsapp: S.db.settings.whatsapp, revocationUrl: S.db.settings.revocationUrl || '' },
    country: c.country || S.db.settings.country || 'CO',
    company: { name: c.business, phone: c.storePhone || '', address: c.city || '' },
    license: code,
  };
  const ascii = s => s.replace(/[\u0080-￿]/g, ch => '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0'));
  const js = `/* Configuracion de entrega generada por el Panel de Licencias - ${today()} */\nwindow.NOIR_PROVISION = ${ascii(JSON.stringify(provision, null, 2))};\n`;
  const out = files.filter(f => f.name !== 'js/provision.js');
  out.push({ name: 'js/provision.js', data: new TextEncoder().encode(js) }, { name: 'data/' });
  const root = 'NOIR STORE - ' + norm(c.business).replace(/[^a-z0-9 ._-]/gi, '').trim().replace(/\b\w/g, m => m.toUpperCase()) + '/';
  const zip = makeZip([{ name: root }, ...out.map(f => ({ ...f, name: root + f.name }))]);
  const a = document.createElement('a'); a.href = URL.createObjectURL(zip); a.download = root.slice(0, -1) + '.zip'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  c.deliveredAt = new Date().toISOString(); store.save();
  return { size: zip.size, files: out.length, name: a.download };
}

/* Código de licencia único con letras y números intercalados: NOIR-A7K3-M9X2-P4T8
   (sin I, O, 0 ni 1 para evitar confusiones; nunca se repite, aunque se borre el cliente) */
const KEY_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ', KEY_DIGITS = '23456789';
function newKey() {
  let k;
  do {
    const r = crypto.getRandomValues(new Uint32Array(12));
    const group = g => [0, 1, 2, 3].map(i => i % 2 === 0 ? KEY_LETTERS[r[g * 4 + i] % KEY_LETTERS.length] : KEY_DIGITS[r[g * 4 + i] % KEY_DIGITS.length]).join('');
    k = `NOIR-${group(0)}-${group(1)}-${group(2)}`;
  } while (S.db.issuedKeys.includes(k) || S.db.clients.some(c => c.key === k));
  S.db.issuedKeys.push(k);
  store.save();
  return k;
}
const DEFAULT_WEB_URL = 'https://noirstudio-web.github.io/noir-store/';
const webUrlOf = () => S.db.settings.webUrl || DEFAULT_WEB_URL;
const licenseMsg = (c, key) => `Hola ${c.contact || c.business} 👋\n\nEste es tu código de licencia de *NOIR STORE* para *${c.business}*:\n\n🔑 *${key}*\n\nGuárdalo: te lo pediremos para renovar, cambiar de plan o recibir soporte. También lo ves en tu sistema en Configuración → Suscripción.\n\n${S.db.settings.vendor}`;
function migratePanel() {
  const d = S.db;
  d.settings.plans = Object.assign(DEFAULT_PLANS(), d.settings.plans || {});
  if ((d.settings.plansVer || 1) < PLANS_VER) {
    // los beneficios nuevos son exclusivos de Premium
    const b = d.settings.plans.basic; b.off = [...new Set([...(b.off || []), ...PREMIUM_EXTRAS])];
    d.settings.plansVer = PLANS_VER;
  }
  d.issuedKeys = d.issuedKeys || [];
  d.clients.forEach(c => {
    if (!c.key) c.key = newKey();
    if (!c.tier) c.tier = 'premium';
    if (!c.status) c.status = 'active';
    c.events = c.events || [];
    delete c.installId;
  });
  store.save();
}

  if (c.status === 'disabled') return { k: 'disabled', label: 'Desactivada', cls: 'err' };
  if (!c.expires) return { k: 'pending', label: 'Sin entregar', cls: '' };
  const d = daysTo(c.expires);
  if (c.status === 'cancelled') return d >= 0 ? { k: 'cancelled', label: `Cancelada · usa hasta ${fmtDate(c.expires)}`, cls: 'warn', d } : { k: 'cancelled', label: 'Cancelada', cls: '', d };
  if (d < 0) return { k: 'expired', label: `Vencida hace ${-d} d`, cls: 'err', d };
  if (d <= 7) return { k: 'soon', label: d === 0 ? 'Vence hoy' : `Vence en ${d} d`, cls: 'warn', d };
  return { k: 'active', label: `Activa · ${d} d`, cls: 'ok', d };
}

    toast(`Código de licencia generado: ${key}`);
  };
  m.$('#f-kcopy').onclick = () => { if (!key) return toast('Primero genera el código de licencia', 'warn'); navigator.clipboard.writeText(key); toast('Código de licencia copiado'); };
  const del = m.$('#f-del'); if (del) del.onclick = () => { if (confirm(`¿Eliminar a ${c.business}? Su código de licencia (${c.key}) no se volverá a usar. Para bloquear su sistema usa “Desactivar” en Gestionar.`)) { S.db.clients = S.db.clients.filter(x => x.id !== c.id); store.save(); m.close(); app(); } };
  m.$('#f-ok').onclick = () => {
    c.business = m.$('#f-b').value.trim(); c.contact = m.$('#f-c').value.trim(); c.phone = m.$('#f-p').value.replace(/\D/g, ''); c.email = m.$('#f-e').value.trim();
    const prevUser = c.username, prevPass = c.password;
    c.city = m.$('#f-ci').value.trim(); c.username = m.$('#f-u').value.trim(); c.password = m.$('#f-pw').value.trim(); c.notes = m.$('#f-n').value.trim();
    c.country = m.$('#f-co').value; c.storePhone = m.$('#f-sp').value.trim();
    if (!c.business) return toast('El nombre del negocio es obligatorio', 'warn');
    if (!/^[a-zA-Z0-9._-]{3,30}$/.test(c.username)) return toast('Usuario inválido: mínimo 3 caracteres, sin espacios', 'warn');
    if (c.password.length < 4) return toast('La contraseña debe tener al menos 4 caracteres', 'warn');
    if (/\s/.test(c.password)) return toast('La contraseña no puede tener espacios', 'warn');
    if (!isNew && (c.codes || []).length && (prevUser !== c.username || prevPass !== c.password)) { c.credsPending = true; logEvent(c, 'Acceso modificado', 'Pendiente de enviar al cliente'); toast('Acceso cambiado. Envíale un código con acceso: Gestionar → Restablecer acceso (o al renovar).', 'warn'); }
    if (!isNew && tier !== c.tier && c.expires) toast('El cambio de plan se aplica al generar su próximo código (Renovar).', 'warn');
    if (isNew || !c.expires) c.tier = tier; else c.nextTier = tier !== c.tier ? tier : undefined;
    if (!key) key = newKey();
    if (c.key && c.key !== key) logEvent(c, 'Código de licencia cambiado', `${c.key} → ${key}`);
    c.key = key;
    if (isNew) logEvent(c, 'Cliente creado', `Licencia ${c.key} · plan ${planOf(c).name}`);
    const i = S.db.clients.findIndex(x => x.id === c.id);
    if (i >= 0) S.db.clients[i] = c; else S.db.clients.push(c);
    store.save(); m.close(); app();
    if (isNew) codeModal(c);
  };
}

/* ---------- Generar código (entregar / renovar / restablecer acceso) ---------- */
function codeModal(c, opt = {}) {
  if (c.status === 'disabled') return toast('Este cliente está desactivado. Reactívalo en Gestionar.', 'warn');
  const first = !(c.codes || []).length;
  const deliver = !!opt.deliver, reset = !!opt.reset && !!c.expires && c.expires >= today();
  let tier = c.nextTier || c.tier || 'basic';
  let dur = reset ? DURATIONS[4] : DURATIONS[0];
  const title = deliver ? 'Versión instalable (.zip)' : reset ? 'Acceso web / restablecer' : (first ? 'Dar acceso' : 'Renovar suscripción');
  const m = modal(`${title} · ${esc(c.business)}`, `
    ${deliver && !reset ? `<div class="callout" style="margin-bottom:14px">📦 Se generará el sistema <b>NOIR STORE</b> para <b>${esc(c.business)}</b> (${esc(countryName(c.country || S.db.settings.country))}), ya activado con su plan, su licencia <b class="mono">${esc(c.key)}</b> y su usuario <b class="mono">${esc(c.username)}</b>.</div>` : ''}
    ${reset ? `<div class="callout warn" style="margin-bottom:14px">Se mantiene su plan y su vencimiento (${fmtDate(c.expires)}). El usuario <b class="mono">${esc(c.username)}</b> quedará con la contraseña registrada en su ficha.</div>` : ''}
    ${c.status === 'cancelled' && !reset ? '<div class="callout warn" style="margin-bottom:14px">Este cliente tiene la suscripción cancelada. Al generar el código se reactivará.</div>' : ''}
    <div style="${reset ? 'display:none' : ''}">
      <div class="field" style="margin-bottom:14px"><label>Plan</label>${planCards(tier)}</div>
      <div class="field" style="margin-bottom:14px"><label>Duración</label><div class="plans" id="plans">${DURATIONS.map(([n, mo], i) => `<button type="button" data-i="${i}" class="${DURATIONS[i] === dur ? 'on' : ''}"><b>${mo || '…'}</b>${mo ? (mo === 1 ? 'mes' : 'meses') : n}</button>`).join('')}</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Desde</label><input id="c-from" type="date" value="${c.expires && c.expires > today() ? c.expires : today()}"><span class="hint">${c.expires && c.expires > today() ? 'Se suma a su vencimiento actual.' : 'Empieza hoy.'}</span></div>
      <div class="field"><label>Vence</label><input id="c-to" type="date"></div>
      <div class="field" style="${reset ? 'display:none' : ''}"><label>Valor cobrado</label><div class="row" style="flex-wrap:nowrap"><input id="c-amt" inputmode="decimal"><select id="c-cur" style="width:96px"><option>COP</option><option>USD</option></select></div><span class="hint" id="c-amt-h"></span></div>
      <div class="field"><label>Código de licencia</label><input class="mono" value="${esc(c.key)}" readonly></div>
      <label class="check span2"><input type="checkbox" id="c-cred" ${first || deliver || reset || c.credsPending ? 'checked' : ''} ${deliver || reset ? 'disabled' : ''}> Incluir usuario y contraseña <span class="muted small">(primera activación o para restablecer el acceso del administrador)</span></label>
    </div>
    <div id="c-out" style="margin-top:16px"></div>`,
    `<button class="btn ghost" data-x>Cerrar</button><button class="btn chrome" id="c-go">${deliver ? '📦 Generar y descargar .zip' : reset ? '🔑 Generar acceso' : first ? '🔑 Generar acceso' : 'Generar código'}</button>`, 'lg');
  const plan = () => S.db.settings.plans[tier];
  const calc = () => {
    const from = m.$('#c-from').value || today();
    if (dur[1]) m.$('#c-to').value = addMonths(from, dur[1]);
    const months = dur[1] || Math.max(1, Math.round(daysTo(m.$('#c-to').value || today()) / 30));
    const cur = m.$('#c-cur').value;
    const v = cur === 'USD' ? Math.round(plan().usd * months * 100) / 100 : plan().cop * months;
    m.$('#c-amt').value = cur === 'USD' ? v.toFixed(2) : Math.round(v);
    m.$('#c-amt-h').textContent = `${plan().name} × ${months} mes(es) = ${fmtCOP(plan().cop * months)} · ${fmtUSD(plan().usd * months)}`;
  };
  calc();
  if (reset) { m.$('#c-to').value = c.expires; m.$('#c-from').value = today(); }
  m.$('#tiers').onclick = e => { const b = e.target.closest('[data-tier]'); if (!b) return; tier = b.dataset.tier; m.el.querySelectorAll('#tiers button').forEach(x => x.classList.toggle('on', x === b)); calc(); };
  m.$('#plans').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; dur = DURATIONS[+b.dataset.i]; m.el.querySelectorAll('#plans button').forEach(x => x.classList.toggle('on', x === b)); calc(); if (!dur[1]) m.$('#c-to').focus(); };
  m.$('#c-from').onchange = calc; m.$('#c-cur').onchange = calc; m.$('#c-to').onchange = () => { if (!dur[1]) calc(); };
  m.$('#c-go').onclick = async () => {
    const to = m.$('#c-to').value;
    if (!to || to < today()) return toast('Indica una fecha de vencimiento válida', 'warn');
    const withCreds = m.$('#c-cred').checked;
    if (reset) tier = c.tier;
    const p = S.db.settings.plans[tier];
    const durName = reset ? ((c.plan || '').split(' · ')[1] || 'Suscripción') : dur[1] ? dur[0] : `Hasta ${fmtDate(to)}`;
    const planName = `${p.name} · ${durName}`;
    const payload = { v: 2, id: uid(), k: c.key, n: c.business, p: planName, tier, lim: { u: p.users, pr: p.products, on: FEATURES.map(f => f[0]).filter(f => !p.off.includes(f)) }, e: to, t: today(), co: c.country || S.db.settings.country || 'CO', vn: S.db.settings.vendor };
    if (c.storePhone) payload.cp = c.storePhone;
    if (c.city) payload.ca = c.city;
    if (S.db.settings.whatsapp) payload.vw = S.db.settings.whatsapp;
    if (withCreds) { const s = randHex(12); Object.assign(payload, { u: c.username, s, h: hashPass(c.password, s), an: c.contact || 'Administrador' }); }
    const btn = m.$('#c-go'); btn.disabled = true;
    const code = await makeCode(payload);
    btn.disabled = false;
    const amount = reset ? 0 : +String(m.$('#c-amt').value).replace(/[^\d.]/g, '') || 0;
    const rec = { id: payload.id, date: new Date().toISOString(), plan: planName, tier, from: m.$('#c-from').value, to, withCreds, kind: deliver ? 'entrega' : reset ? 'acceso' : first ? 'activación' : 'renovación', amount, currency: m.$('#c-cur').value, code };
    c.codes = c.codes || []; c.codes.push(rec);
    if (!c.expires || to > c.expires) c.expires = to;
    c.plan = planName; c.tier = tier; delete c.nextTier;
    if (withCreds) { delete c.credsPending; c.credsSentAt = new Date().toISOString(); }
    if (c.status === 'cancelled' && !reset) { c.status = 'active'; logEvent(c, 'Suscripción reanudada'); }
    logEvent(c, rec.kind[0].toUpperCase() + rec.kind.slice(1), `${planName} hasta ${fmtDate(to)}${amount ? ` · ${rec.currency === 'USD' ? fmtUSD(amount) : fmtCOP(amount)}` : ''}`);
    const i = S.db.clients.findIndex(x => x.id === c.id); S.db.clients[i] = c; store.save();
    const creds = `🔐 Tus datos de acceso (escríbelos tal cual):\nUsuario:\n${c.username}\nContraseña:\n${c.password}\n\n(Puedes cambiarlos en Configuración → Mi cuenta)`;
    const msg = deliver
      ? `Hola ${c.contact || c.business} 👋\n\nTe envío tu sistema *NOIR STORE* para *${c.business}*, ya configurado y activado.\nPlan: *${planName}* · válido hasta el *${fmtDate(to)}*\nLicencia: ${c.key}\n${tier === 'premium' ? '\n⭐ Tu plan Premium incluye: apartados, programa de puntos, promociones automáticas, comisiones, reportes, compras, WhatsApp, resúmenes al dueño, logo propio y soporte prioritario.\n' : ''}\n📦 Cómo instalarlo:\n1. Descomprime el archivo .zip que te envié (clic derecho → Extraer todo).\n2. Abre la carpeta y haz doble clic en *INICIAR NOIR STORE.bat*.\n3. Entra con tus datos:\n\n${creds}\n\nPara guardar en archivos y usarlo desde varios equipos instala Node.js (https://nodejs.org). Sin Node.js también funciona en el navegador.\n\n${S.db.settings.vendor}`
      : withCreds ? `Hola ${c.contact || c.business} 👋\n\n${first ? 'Ya tienes tu sistema' : 'Aquí tienes el acceso a tu sistema'} *NOIR STORE* para *${c.business}*. No tienes que descargar nada.\nPlan: *${planName}* · válido hasta el *${fmtDate(to)}*\n${tier === 'premium' ? '⭐ Incluye apartados, puntos, promociones, comisiones, reportes, compras, WhatsApp y más.\n' : ''}\n🌐 1. Entra aquí (computador, tablet o celular):\n${webUrlOf()}\n\n🔑 2. Pega este código de activación:\n\n${code}\n\n👤 3. Entra con tus datos (escríbelos tal cual):\nUsuario:\n${c.username}\nContraseña:\n${c.password}\n\n💾 Tu información se guarda en ese navegador: usa siempre el mismo equipo y descarga un respaldo cada semana (Configuración → Respaldo y datos).\n\n${S.db.settings.vendor}`
      : `Hola ${c.contact || c.business} 👋\n\nAquí tienes tu código ${reset ? 'para restablecer tu acceso' : first ? 'de activación' : 'de renovación'} de *NOIR STORE*\nPlan: *${planName}* · válido hasta el *${fmtDate(to)}*\nLicencia: ${c.key}\n\n${code}\n\n${withCreds ? creds + '\n\n' : ''}Cómo usarlo: entra a tu sistema (${webUrlOf()}), ve a Configuración → Suscripción y pega el código completo.\n\n${S.db.settings.vendor}`;
    m.$('#c-out').innerHTML = `<div class="callout ok" style="margin-bottom:10px">✓ ${deliver ? 'Sistema preparado' : 'Código generado'}: ${esc(planName)} hasta el ${fmtDate(to)}${withCreds ? ' · incluye usuario y contraseña' : ''}</div>
      ${deliver ? '<div id="c-zipst" class="callout" style="margin-bottom:10px">Preparando el .zip…</div>' : ''}
      <div class="code" id="c-code">${esc(code)}</div>
      <div class="row" style="margin-top:10px">${withCreds ? `<button class="btn ghost" id="c-zip" title="Solo si el cliente prefiere instalarlo en su computador">📦 Versión instalable (.zip, opcional)</button>` : ''}<button class="btn" id="c-copy">Copiar código</button><button class="btn" id="c-copym">Copiar mensaje</button>
      ${c.phone ? `<a class="btn success" target="_blank" href="${waLink(c.phone, msg)}">Enviar por WhatsApp</a>` : '<span class="muted small">Agrega su WhatsApp para enviarlo directo.</span>'}</div>
      ${deliver ? '<p class="small muted" style="margin-bottom:0">WhatsApp no permite adjuntar archivos desde un enlace: al abrir el chat, adjunta el .zip de tu carpeta Descargas y envía el mensaje.</p>' : ''}`;
    m.$('#c-copy').onclick = () => { navigator.clipboard.writeText(code); toast('Código copiado'); };
    m.$('#c-copym').onclick = () => { navigator.clipboard.writeText(msg); toast('Mensaje copiado'); };
    const doZip = async () => {
      const st = m.$('#c-zipst') || m.$('#c-out').appendChild(Object.assign(document.createElement('div'), { id: 'c-zipst', className: 'callout' }));
      st.className = 'callout'; st.textContent = 'Preparando el .zip…';
      try { const r = await buildPackage(c, code); st.className = 'callout ok'; st.innerHTML = `✓ Descargado <b>${esc(r.name)}</b> (${(r.size / 1048576).toFixed(1)} MB, ${r.files} archivos). Envíaselo a tu cliente.`; app(); }
      catch (e) { st.className = 'callout warn'; st.textContent = e.name === 'AbortError' ? 'Elige la carpeta del sistema NOIR STORE para generar el .zip.' : e.message; }
    };
    const zb = m.$('#c-zip'); if (zb) zb.onclick = doZip;
    app();
    if (deliver) doZip();
  };
}

/* ---------- Gestionar cliente: renovar, cancelar, desactivar ---------- */
function manageModal(c) {
  const s = clientState(c), p = planOf(c);
  const m = modal(`Gestionar · ${esc(c.business)}`, `
    <div class="grid2" style="margin-bottom:14px">
      <div class="span2"><div class="hint">Código de licencia</div><div class="row" style="gap:8px"><span class="mono" style="font-size:17px;font-weight:600;letter-spacing:.08em">${esc(c.key)}</span>
        <button class="btn sm" id="m-ck">Copiar</button>${c.phone ? `<a class="btn sm success" target="_blank" href="${waLink(c.phone, licenseMsg(c, c.key))}">Enviar por WhatsApp</a>` : ''}
        ${c.status !== 'disabled' ? '<button class="btn sm ghost" id="m-knew">🔑 Generar nuevo código de licencia</button>' : ''}</div></div>
      <div><div class="hint">Estado</div><span class="badge ${s.cls}">${s.label}</span></div>
      <div><div class="hint">Plan</div>${tierBadge(c)} ${esc((c.plan || '').split(' · ')[1] || '')} <span class="small muted">· ${fmtCOP(p.cop)} / ${fmtUSD(p.usd)} al mes</span>${c.nextTier ? `<div class="small" style="color:var(--warn)">Cambiará a ${esc(S.db.settings.plans[c.nextTier].name)} en la próxima renovación</div>` : ''}</div>
      <div><div class="hint">Vence</div>${fmtDate(c.expires)}</div>
      <div><div class="hint">Usuario</div><span class="mono">${esc(c.username)}</span></div><div><div class="hint">Contraseña inicial</div><span class="mono">${esc(c.password)}</span></div>
    </div>
    ${c.credsPending ? `<div class="callout warn" style="margin-bottom:14px">⚠️ Cambiaste el usuario o la contraseña de este cliente y todavía no se los has enviado. Su sistema sigue con los datos anteriores. Usa <b>🔐 Restablecer acceso</b> (o renueva) y envíale el código.</div>` : ''}
    ${c.notes ? `<div class="callout" style="margin-bottom:14px">${esc(c.notes)}</div>` : ''}
    <div class="row" style="margin-bottom:16px">
      ${c.status !== 'disabled' ? `<button class="btn primary" id="m-renew">${c.expires ? 'Renovar / cambiar plan' : '🔑 Dar acceso'}</button>` : ''}
      ${c.status !== 'disabled' && c.expires && c.expires >= today() ? `<button class="btn ghost" id="m-zip">📦 Versión instalable (.zip)</button><button class="btn primary" id="m-reset" title="Genera un código con su usuario y contraseña (mantiene su plan y su vencimiento). Sirve para entrar por el enlace web o para restablecer el acceso.">🔑 Enviar acceso web</button>` : ''}
      <span class="spacer"></span>
      ${c.status === 'active' && c.expires ? '<button class="btn" id="m-cancel">Cancelar suscripción</button>' : ''}
      ${c.status === 'cancelled' ? '<button class="btn" id="m-resume">Reanudar suscripción</button>' : ''}
      ${c.status !== 'disabled' ? '<button class="btn danger" id="m-disable">Desactivar licencia</button>' : '<button class="btn success" id="m-enable">Reactivar licencia</button>'}
    </div>
    <div class="tabs"><button class="tab on">Códigos</button></div>
    <table><thead><tr><th>Fecha</th><th>Tipo</th><th>Plan</th><th>Vigencia</th><th class="r">Valor</th><th></th></tr></thead><tbody>
    ${(c.codes || []).slice().reverse().map(k => `<tr><td>${fmtDate(k.date)}</td><td>${esc(k.kind || 'código')}${k.withCreds ? ' <span class="badge info">con acceso</span>' : ''}</td><td>${esc(k.plan)}</td><td>${fmtDate(k.from)} → ${fmtDate(k.to)}</td><td class="r">${k.amount ? (k.currency === 'USD' ? fmtUSD(k.amount) : fmtCOP(k.amount)) : '—'}</td><td class="acts"><button class="btn sm" data-copy="${k.id}">Copiar</button></td></tr>`).join('') || '<tr><td colspan="6"><div class="empty">Sin códigos</div></td></tr>'}
    </tbody></table>
    ${(c.events || []).length ? `<div class="hint" style="margin:16px 0 6px">Historial</div>${c.events.slice().reverse().map(e => `<div class="small" style="padding:4px 0;border-bottom:1px solid var(--line)">${fmtDate(e.date)} · <b>${esc(e.type)}</b> ${esc(e.note || '')}</div>`).join('')}` : ''}`,
    `<button class="btn ghost" data-x>Cerrar</button>`, 'lg');
  const reopen = () => { m.close(); app(); manageModal(S.db.clients.find(x => x.id === c.id)); };
  const save = () => { const i = S.db.clients.findIndex(x => x.id === c.id); S.db.clients[i] = c; store.save(); };
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (b) { navigator.clipboard.writeText(c.codes.find(k => k.id === b.dataset.copy).code); toast('Código copiado'); } });
  m.$('#m-ck').onclick = () => { navigator.clipboard.writeText(c.key); toast('Código de licencia copiado'); };
  const kn = m.$('#m-knew'); if (kn) kn.onclick = () => {
    if (!confirm(`¿Generar un código de licencia NUEVO para ${c.business}?\n\nLa licencia ${c.key} queda retirada y no se vuelve a usar.${(c.codes || []).length ? '\nSu sistema tomará la nueva licencia cuando active su próximo código (renovación o restablecer acceso).' : ''}`)) return;
    const old = c.key; c.key = newKey(); logEvent(c, 'Código de licencia cambiado', `${old} → ${c.key}`); save();
    toast(`Nuevo código de licencia: ${c.key}`); reopen();
  };
  const on = (id, fn) => { const b = m.$(id); if (b) b.onclick = fn; };
  on('#m-renew', () => { m.close(); codeModal(c); });
  on('#m-zip', () => { m.close(); codeModal(c, { deliver: true, reset: true }); });
  on('#m-reset', () => { m.close(); codeModal(c, { reset: true }); });
  on('#m-cancel', () => {
    if (!confirm(`¿Cancelar la suscripción de ${c.business}?\n\nSu sistema seguirá funcionando hasta el ${fmtDate(c.expires)} (ya está pagado) y no se le enviarán recordatorios de renovación. Puedes reanudarla cuando quieras.`)) return;
    const why = prompt('Motivo de la cancelación (opcional):') || '';
    c.status = 'cancelled'; c.cancelledAt = new Date().toISOString(); logEvent(c, 'Suscripción cancelada', why); save(); toast('Suscripción cancelada'); reopen();
  });
  on('#m-resume', () => { c.status = 'active'; logEvent(c, 'Suscripción reanudada'); save(); toast('Suscripción reanudada'); reopen(); });
  on('#m-disable', () => {
    if (!confirm(`¿Desactivar la licencia ${c.key} de ${c.business}?\n\nNo podrás generarle códigos hasta reactivarla.${S.db.settings.revocationUrl ? '\nSu sistema se bloqueará la próxima vez que se conecte a internet, después de que publiques la lista actualizada.' : '\nComo no tienes configurada la desactivación remota, su sistema se bloqueará al llegar a su fecha de vencimiento.'}`)) return;
    const why = prompt('Motivo (opcional):') || '';
    c.status = 'disabled'; c.disabledAt = new Date().toISOString(); logEvent(c, 'Licencia desactivada', why); save();
    toast(S.db.settings.revocationUrl ? 'Licencia desactivada. Publica la lista actualizada (Configuración → Desactivación remota).' : 'Licencia desactivada', 'warn');
    reopen();
  });
  on('#m-enable', () => {
    c.status = 'active'; logEvent(c, 'Licencia reactivada'); save();
    toast(S.db.settings.revocationUrl ? 'Licencia reactivada. Publica la lista actualizada para desbloquear su sistema.' : 'Licencia reactivada');
    reopen();
  });
}

/* ---------- Herramientas ---------- */
function verifyTool() {
  const m = modal('Verificar un código', `<div class="field"><label>Pega un código NOIR1…</label><textarea id="v-c" rows="5" class="mono" style="font-size:12px"></textarea></div><div id="v-out" style="margin-top:12px"></div>`,
    `<button class="btn ghost" data-x>Cerrar</button><button class="btn primary" id="v-go">Verificar</button>`);
  m.$('#v-go').onclick = async () => {
    try {
      const { payload: p, ok } = await decodeCode(m.$('#v-c').value);
      if (p.type === 'revocation') { m.$('#v-out').innerHTML = `<div class="callout ${ok ? 'ok' : 'warn'}">${ok ? '✓ Lista de desactivación válida' : '✗ Firma inválida'} · ${(p.keys || []).length} licencia(s) · ${fmtDate(p.t)}</div><div class="mono small" style="margin-top:8px">${(p.keys || []).map(esc).join('<br>')}</div>`; return; }
      const c = S.db.clients.find(x => x.key === p.k);
      m.$('#v-out').innerHTML = `<div class="callout ${ok ? 'ok' : 'warn'}">${ok ? '✓ Firma válida (generado por tu panel)' : '✗ Firma inválida: este código no es tuyo o fue modificado'}</div>
        <div class="grid2" style="margin-top:12px"><div><div class="hint">Negocio</div>${esc(p.n)}${c ? '' : ' <span class="badge">no está en tu lista</span>'}</div><div><div class="hint">Licencia</div><span class="mono">${esc(p.k || '—')}</span></div>
        <div><div class="hint">Plan</div>${esc(p.p)}</div><div><div class="hint">Vence</div>${fmtDate(p.e)}</div><div><div class="hint">Emitido</div>${fmtDate(p.t)}</div>
        <div><div class="hint">Incluye acceso</div>${p.u ? 'Sí · usuario ' + esc(p.u) : 'No'}</div><div class="span2"><div class="hint">Límites</div>${p.lim ? esc(limText({ users: p.lim.u, products: p.lim.pr, off: p.lim.on ? FEATURES.map(f => f[0]).filter(f => !p.lim.on.includes(f)) : (p.lim.off || []) })) : 'Sin límites'}</div></div>`;
    } catch (e) { m.$('#v-out').innerHTML = `<div class="callout warn">${esc(e.message)}</div>`; }
  };
}
async function revocationFile() {
  const keys = S.db.clients.filter(c => c.status === 'disabled').map(c => c.key);
  const code = await makeCode({ type: 'revocation', keys, t: today(), n: keys.length });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([code], { type: 'text/plain' })); a.download = 'noir-revocados.txt'; a.click();
  return keys.length;
}
function settingsModal() {
  const s = S.db.settings, P = s.plans;
  const planEditor = k => `<div class="card" style="padding:14px"><div class="field" style="margin-bottom:10px"><label>Nombre</label><input data-p="${k}" data-f="name" value="${esc(P[k].name)}"></div>
    <div class="grid2" style="gap:10px"><div class="field"><label>Precio mensual COP</label><input data-p="${k}" data-f="cop" inputmode="numeric" value="${P[k].cop}"></div><div class="field"><label>Precio mensual USD</label><input data-p="${k}" data-f="usd" inputmode="decimal" value="${P[k].usd}"></div>
    <div class="field"><label>Máx. usuarios (0 = ilimitado)</label><input data-p="${k}" data-f="users" inputmode="numeric" value="${P[k].users}"></div><div class="field"><label>Máx. productos (0 = ilimitado)</label><input data-p="${k}" data-f="products" inputmode="numeric" value="${P[k].products}"></div></div>
    <div class="hint" style="margin:10px 0 6px">Funciones incluidas</div>${FEATURES.map(([f, n]) => `<label class="check" style="display:flex;margin:4px 0"><input type="checkbox" data-p="${k}" data-feat="${f}" ${P[k].off.includes(f) ? '' : 'checked'}> ${n}</label>`).join('')}</div>`;
  const m = modal('Configuración del panel', `<div class="tabs"><button class="tab on" data-t="gen">General</button><button class="tab" data-t="plans">Planes</button><button class="tab" data-t="rev">Desactivación remota</button></div>
    <div data-pane="gen"><div class="grid2">
    <div class="field"><label>Tu nombre / marca</label><input id="s-v" value="${esc(s.vendor)}"></div>
    <div class="field"><label>Tu WhatsApp</label><input id="s-w" value="${esc(s.whatsapp)}" placeholder="573001234567"></div>
    <div class="field span2"><label>Enlace del sistema web (lo recibe cada cliente)</label><input id="s-url" value="${esc(webUrlOf())}"></div>
    <div class="callout span2 small">Tu nombre y WhatsApp se incluyen automáticamente en cada sistema que entregas: tus clientes verán el botón “Contactar” para renovar.</div>
    <div class="field"><label>País por defecto de nuevos clientes</label><select id="s-co">${COUNTRIES.map(([k, n]) => `<option value="${k}" ${(s.country || 'CO') === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Carpeta del sistema NOIR STORE</label><div class="row" style="flex-wrap:nowrap"><input id="s-dir" readonly placeholder="Sin elegir"><button class="btn" id="s-pick" type="button">Elegir</button></div><span class="hint">La que contiene index.html. Se usa para generar los .zip.</span></div>
    <div class="field span2"><label>Respaldo de clientes</label><div class="row"><button class="btn" id="s-exp">Descargar respaldo</button><button class="btn" id="s-imp">Restaurar respaldo</button></div><span class="hint">Los datos del panel viven en este navegador: descarga respaldos con frecuencia.</span></div>
    <div class="field span2"><label>Cambiar usuario y contraseña del panel</label><div class="row" style="flex-wrap:nowrap"><input id="s-p1" type="password" placeholder="Contraseña actual"><input id="s-u2" placeholder="Usuario" value="${esc(getSlot().user || 'Richy')}"><input id="s-p2" type="password" placeholder="Nueva contraseña (mín. 6)"><button class="btn" id="s-pw">Cambiar</button></div><span class="hint">Deja la nueva contraseña vacía para cambiar solo el usuario.</span></div></div></div>
    <div data-pane="plans" style="display:none"><div class="grid2">${planEditor('basic')}${planEditor('premium')}</div><p class="small muted">Los cambios aplican a los códigos que generes desde ahora. Los clientes los reciben al renovar.</p></div>
    <div data-pane="rev" style="display:none">
      <p class="small muted" style="margin-top:0">Para que <b>Desactivar licencia</b> bloquee el sistema del cliente de inmediato (y no al vencer), publica una lista firmada en internet. Cada sistema la revisa al abrir y cada 6 horas cuando tiene internet.</p>
      <ol class="small" style="color:var(--text2);line-height:1.7;padding-left:18px"><li>Crea un repositorio público en GitHub (gratis) y sube el archivo <b>noir-revocados.txt</b> que descargas aquí.</li><li>Abre el archivo en GitHub, pulsa <b>Raw</b> y copia esa dirección (empieza por https://raw.githubusercontent.com/…).</li><li>Pégala abajo y guarda. Los sistemas que entregues desde ahora la usarán.</li><li>Cada vez que desactives o reactives a alguien, descarga la lista de nuevo y reemplázala en GitHub.</li></ol>
      <div class="field" style="margin:12px 0"><label>Dirección pública de la lista</label><input id="s-rev" value="${esc(s.revocationUrl || '')}" placeholder="https://raw.githubusercontent.com/usuario/repo/main/noir-revocados.txt"></div>
      <button class="btn primary" id="s-revdl">Descargar lista firmada (${S.db.clients.filter(c => c.status === 'disabled').length} desactivada(s))</button></div>`,
    `<button class="btn ghost" data-x>Cerrar</button><button class="btn primary" id="s-ok">Guardar</button>`, 'lg');
  m.el.querySelectorAll('[data-t]').forEach(t => t.onclick = () => { m.el.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === t)); m.el.querySelectorAll('[data-pane]').forEach(p => p.style.display = p.dataset.pane === t.dataset.t ? '' : 'none'); });
  idb.get('sysdir').then(h => { if (h) m.$('#s-dir').value = h.name; });
  m.$('#s-pick').onclick = async () => { try { const h = await systemDir(true); m.$('#s-dir').value = h.name; toast('Carpeta del sistema guardada'); } catch (e) { if (e.name !== 'AbortError') toast(e.message, 'err'); } };
  m.$('#s-revdl').onclick = async () => { const n = await revocationFile(); toast(`Lista descargada con ${n} licencia(s) desactivada(s). Súbela a GitHub.`); };
  m.$('#s-ok').onclick = () => {
    s.vendor = m.$('#s-v').value.trim() || 'NOIR Studio'; s.whatsapp = m.$('#s-w').value.replace(/\D/g, ''); s.country = m.$('#s-co').value; s.webUrl = m.$('#s-url').value.trim() || DEFAULT_WEB_URL;
    s.revocationUrl = m.$('#s-rev').value.trim();
    for (const k of ['basic', 'premium']) {
      const g = f => m.el.querySelector(`[data-p="${k}"][data-f="${f}"]`).value;
      P[k].name = g('name').trim() || P[k].name;
      P[k].cop = Math.round(+g('cop').replace(/[^\d]/g, '') || 0); P[k].usd = Math.round((+g('usd').replace(/[^\d.]/g, '') || 0) * 100) / 100;
      P[k].users = Math.max(0, parseInt(g('users')) || 0); P[k].products = Math.max(0, parseInt(g('products')) || 0);
      P[k].off = FEATURES.map(f => f[0]).filter(f => !m.el.querySelector(`[data-p="${k}"][data-feat="${f}"]`).checked);
    }
    store.save(); toast('Configuración guardada'); m.close(); app();
  };
  m.$('#s-exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S.db, null, 2)], { type: 'application/json' })); a.download = `noir-licencias-clientes-${today()}.json`; a.click(); };
  m.$('#s-imp').onclick = () => { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json'; i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (!Array.isArray(d.clients)) throw 0; if (!confirm(`¿Reemplazar tus ${S.db.clients.length} clientes por los ${d.clients.length} del respaldo?`)) return; d.issuedKeys = [...new Set([...(d.issuedKeys || []), ...(S.db.issuedKeys || [])])]; S.db = d; store.save(); m.close(); app(); toast('Respaldo restaurado'); } catch (e) { toast('Archivo inválido', 'err'); } }; i.click(); };
  m.$('#s-pw').onclick = async () => {
    const p1 = m.$('#s-p1').value, p2 = m.$('#s-p2').value, u2 = m.$('#s-u2').value.trim();
    if (u2.length < 3) return toast('El usuario debe tener al menos 3 caracteres', 'warn');
    if (p2 && p2.length < 6) return toast('La nueva contraseña debe tener al menos 6 caracteres', 'warn');
    try { const file = await decryptSlot(p1); await sealPrivate(file, p2 || p1, u2); toast('Acceso al panel actualizado'); m.$('#s-p1').value = m.$('#s-p2').value = ''; }
    catch (e) { toast('La contraseña actual no es correcta', 'err'); }
  };
}

if (!window.isSecureContext || !crypto.subtle) document.getElementById('root').innerHTML = '<div class="lock"><div class="lock-box"><h1>Abre este archivo con doble clic</h1><p>El panel debe abrirse directamente desde la carpeta (file://) en Chrome o Edge.</p></div></div>';
else lockScreen();
</script>
</body>
</html>
